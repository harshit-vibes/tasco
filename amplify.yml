# AWS Amplify Build Configuration for Tasco Compliance-QA
# ========================================================
# This configuration deploys the compliance-qa app from the monorepo

version: 1

frontend:
  phases:
    preBuild:
      commands:
        # Install Bun package manager
        - curl -fsSL https://bun.sh/install | bash
        - export BUN_INSTALL="$HOME/.bun"
        - export PATH="$BUN_INSTALL/bin:$PATH"
        # Verify Bun installation
        - bun --version
        # Install all dependencies from root (monorepo)
        - bun install
    build:
      commands:
        - export BUN_INSTALL="$HOME/.bun"
        - export PATH="$BUN_INSTALL/bin:$PATH"
        # Build compliance-qa app using Turborepo filter
        - bun run build --filter=@tasco/compliance-qa
  artifacts:
    baseDirectory: apps/compliance-qa/.next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - packages/**/node_modules/**/*
      - apps/**/.next/cache/**/*
      - .turbo/**/*
