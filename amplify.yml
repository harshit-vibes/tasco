# AWS Amplify Build Configuration for Tasco Monorepo
# ===================================================
#
# For deploying a single app from this Turborepo monorepo:
# 1. Create Amplify app in AWS Console
# 2. Connect to GitHub repo: harshit-vibes/tasco
# 3. Set environment variable: APP_PATH=compliance-qa (or desired app)
# 4. Set all required environment variables (LYZR_API_KEY, etc.)
# 5. Push to prod branch to trigger build

version: 1

frontend:
  phases:
    preBuild:
      commands:
        # Install Bun package manager
        - curl -fsSL https://bun.sh/install | bash
        - export BUN_INSTALL="$HOME/.bun"
        - export PATH="$BUN_INSTALL/bin:$PATH"
        # Verify Bun installation
        - bun --version
        # Install all dependencies from root (monorepo)
        - bun install
    build:
      commands:
        - export BUN_INSTALL="$HOME/.bun"
        - export PATH="$BUN_INSTALL/bin:$PATH"
        # Build the specific app using Turborepo filter
        - bun run build --filter=@tasco/${APP_PATH:-compliance-qa}
  artifacts:
    baseDirectory: apps/${APP_PATH:-compliance-qa}/.next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - packages/**/node_modules/**/*
      - apps/**/.next/cache/**/*
      - .turbo/**/*
